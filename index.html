<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오늘 만날 수 있어?</title>
<meta property="og:title" content="카드가 도착했어요 💌">
<meta property="og:description" content="눌러서 카드를 열어보세요">
<meta property="og:image" content="https://heekwon-medihive.github.io/play-card/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
  :root {
    --bg: #0b0a14;
    --card-w: min(78vw, 320px);
    --card-h: calc(var(--card-w) * 1.5);
    --gold: #f6d365;
    --pink: #ff6fb5;
    --violet: #8a6cff;
    --cyan: #5ef2ff;
    --o: #35e0a1;
    --x: #ff5c7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #1b1733 0%, var(--bg) 60%, #050409 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  /* ---- background stars ---- */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .stars i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .5;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .15; transform: scale(.6); } to { opacity: .9; transform: scale(1.3); } }

  /* ---- screen flash ---- */
  .flash {
    position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 6;
  }
  .flash.on { animation: flash .7s ease-out forwards; }
  @keyframes flash { 0% { opacity: 0; } 12% { opacity: .95; } 100% { opacity: 0; } }

  /* ---- light rays ---- */
  .rays {
    position: fixed; left: 50%; top: 50%; width: 200vmax; height: 200vmax;
    transform: translate(-50%,-50%) scale(0); opacity: 0; z-index: 1; pointer-events: none;
    background: repeating-conic-gradient(from 0deg,
      rgba(246,211,101,.0) 0deg, rgba(246,211,101,.18) 6deg, rgba(246,211,101,.0) 12deg);
    border-radius: 50%;
    mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 60%);
    -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 25%, transparent 60%);
  }
  .rays.on { animation: rays 2.2s ease-out forwards; }
  @keyframes rays {
    0% { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1) rotate(60deg); opacity: 0; }
  }

  /* ---- scene ---- */
  .scene {
    position: relative; z-index: 3;
    width: var(--card-w); height: var(--card-h);
    perspective: 1400px;
  }
  .hint {
    position: absolute; left: 50%; bottom: -56px; transform: translateX(-50%);
    font-size: 14px; letter-spacing: .12em; color: rgba(255,255,255,.7);
    white-space: nowrap; animation: bob 1.6s ease-in-out infinite;
    transition: opacity .3s;
  }
  @keyframes bob { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,-6px); } }

  .card {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotateX(4deg) rotateY(-6deg); }
    50% { transform: translateY(-12px) rotateX(-3deg) rotateY(6deg); }
  }
  .card.shake { animation: shake .55s ease-in-out; }
  @keyframes shake {
    0% { transform: rotate(0) scale(1); }
    15% { transform: rotate(-4deg) scale(1.03); }
    30% { transform: rotate(4deg) scale(1.05); }
    45% { transform: rotate(-5deg) scale(1.07); }
    60% { transform: rotate(5deg) scale(1.09); }
    75% { transform: rotate(-3deg) scale(1.1); }
    100% { transform: rotate(0) scale(1.12); }
  }
  .card.open {
    animation: none;
    transform: rotateY(180deg);
    cursor: default;
  }

  .face {
    position: absolute; inset: 0; border-radius: 22px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  /* front (closed) */
  .front {
    background: linear-gradient(160deg, #2a2352 0%, #171331 55%, #0f0c22 100%);
    border: 1.5px solid rgba(246,211,101,.55);
    box-shadow:
      0 30px 80px rgba(0,0,0,.6),
      0 0 40px rgba(138,108,255,.35),
      inset 0 0 40px rgba(246,211,101,.08);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  .front::before {
    content: ""; position: absolute; inset: 10px; border-radius: 16px;
    border: 1px solid rgba(246,211,101,.35);
  }
  .front::after {
    content: ""; position: absolute; top: -60%; left: -80%; width: 60%; height: 220%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.22) 50%, transparent 100%);
    transform: rotate(12deg);
    animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes shine { 0% { left: -80%; } 60%, 100% { left: 140%; } }
  .seal {
    width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a3, var(--gold) 45%, #b8862b 100%);
    box-shadow: 0 8px 24px rgba(246,211,101,.45), inset 0 -4px 10px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; position: relative;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 8px 24px rgba(246,211,101,.45), inset 0 -4px 10px rgba(0,0,0,.25); }
    50% { box-shadow: 0 8px 44px rgba(246,211,101,.85), inset 0 -4px 10px rgba(0,0,0,.25); }
  }
  .front .title {
    font-size: 15px; letter-spacing: .3em; color: var(--gold); text-transform: uppercase;
    font-weight: 600; opacity: .9;
  }
  .front .sub { font-size: 12px; color: rgba(255,255,255,.5); letter-spacing: .1em; }

  /* back (opened) */
  .back {
    transform: rotateY(180deg);
    background: linear-gradient(165deg, #fffdf7 0%, #fff4e0 100%);
    color: #1e1a2e;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(246,211,101,.35);
    display: flex; flex-direction: column;
    padding: 26px 22px 22px;
    text-align: center;
  }
  .back::before {
    content: ""; position: absolute; inset: 9px; border-radius: 16px;
    border: 1.5px solid rgba(184,134,43,.45); pointer-events: none;
  }
  .back > * { position: relative; }
  .back .inner {
    opacity: 0; transform: translateY(14px);
    transition: opacity .6s .55s, transform .6s .55s;
    display: flex; flex-direction: column; height: 100%;
  }
  .card.open .back .inner { opacity: 1; transform: none; }

  .eyebrow { font-size: 11px; letter-spacing: .3em; color: #b8862b; font-weight: 700; margin-bottom: 10px; }
  .question {
    font-size: 24px; font-weight: 800; line-height: 1.35; margin: 4px 0 18px;
    word-break: keep-all;
  }
  .question small { display: block; font-size: 13px; font-weight: 500; color: #6d6580; margin-top: 8px; }

  .choices { display: flex; gap: 14px; justify-content: center; margin-bottom: 14px; }
  .choice {
    width: 92px; height: 92px; border-radius: 50%; border: 3px solid;
    background: #fff; font-size: 44px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s, color .2s;
    font-family: inherit;
  }
  .choice.o { color: var(--o); border-color: var(--o); }
  .choice.x { color: var(--x); border-color: var(--x); }
  .choice:active { transform: scale(.92); }
  .choice.selected.o { background: var(--o); color: #fff; box-shadow: 0 0 0 6px rgba(53,224,161,.25), 0 10px 30px rgba(53,224,161,.4); transform: scale(1.08); }
  .choice.selected.x { background: var(--x); color: #fff; box-shadow: 0 0 0 6px rgba(255,92,122,.25), 0 10px 30px rgba(255,92,122,.4); transform: scale(1.08); }
  .choice.dim { opacity: .35; transform: scale(.9); }

  .reason {
    display: none; margin-bottom: 12px;
  }
  .reason.show { display: block; animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .reason textarea {
    width: 100%; height: 72px; resize: none; border-radius: 12px;
    border: 1.5px solid #e6d6b8; background: #fff; padding: 10px 12px;
    font-size: 14px; font-family: inherit; color: #1e1a2e; outline: none;
  }
  .reason textarea:focus { border-color: var(--x); }

  .spacer { flex: 1; }
  .btn {
    width: 100%; padding: 14px; border-radius: 14px; border: 0;
    background: linear-gradient(135deg, #1e1a2e, #3a2f66);
    color: #fff; font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: transform .15s, opacity .2s, background .3s;
    box-shadow: 0 8px 20px rgba(30,26,46,.3);
  }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.done { background: linear-gradient(135deg, #1fae7e, #35e0a1); }
  .tip { font-size: 11px; color: #8a8298; margin-top: 8px; line-height: 1.5; }

  /* result view (sender) */
  .result-mark {
    font-size: 120px; font-weight: 900; line-height: 1; margin: 6px 0 8px;
    animation: stamp .6s .7s cubic-bezier(.2,1.5,.5,1) both;
  }
  @keyframes stamp { from { transform: scale(3) rotate(-15deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .result-mark.o { color: var(--o); text-shadow: 0 8px 30px rgba(53,224,161,.5); }
  .result-mark.x { color: var(--x); text-shadow: 0 8px 30px rgba(255,92,122,.5); }
  .result-text { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
  .result-reason {
    background: #fff; border: 1.5px solid #e6d6b8; border-radius: 12px;
    padding: 12px; font-size: 14px; line-height: 1.55; text-align: left;
    color: #3b3550; white-space: pre-wrap; word-break: break-word;
  }
  .result-reason b { display: block; font-size: 11px; color: #b8862b; letter-spacing: .2em; margin-bottom: 6px; }

  .footer {
    position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: rgba(255,255,255,.35); z-index: 4;
  }
  .footer button {
    background: none; border: 0; color: rgba(255,255,255,.45); font-size: 12px;
    text-decoration: underline; cursor: pointer; font-family: inherit; padding: 6px 8px;
  }

  .toast {
    position: fixed; left: 50%; top: 28px; transform: translate(-50%,-30px);
    background: rgba(255,255,255,.95); color: #1e1a2e; padding: 10px 18px;
    border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0;
    transition: .3s; z-index: 20; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translate(-50%,0); }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="rays" id="rays"></div>
<div class="flash" id="flash"></div>
<canvas id="fx"></canvas>

<div class="scene">
  <div class="card" id="card">
    <div class="face front">
      <div class="seal">💌</div>
      <div class="title">Invitation</div>
      <div class="sub" id="frontSub">탭해서 열어보기</div>
    </div>
    <div class="face back">
      <div class="inner" id="inner"></div>
    </div>
  </div>
  <div class="hint" id="hint">✦ 카드를 눌러주세요 ✦</div>
</div>

<div class="footer" id="footer"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const question = params.get('q') || '오늘 만날 수 있어?';
  const answer = params.get('a');          // 'o' | 'x' | null
  const reason = params.get('r') || '';
  const isReply = answer === 'o' || answer === 'x';

  // ----- stars -----
  const stars = $('#stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--d', (1.5 + Math.random() * 3) + 's');
    s.style.animationDelay = (Math.random() * 3) + 's';
    stars.appendChild(s);
  }

  // ----- particle system -----
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W, H, parts = [];
  function resize() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', resize); resize();
  const COLORS = ['#f6d365', '#ff6fb5', '#8a6cff', '#5ef2ff', '#ffffff', '#ffb347'];
  function burst(n, opts = {}) {
    const cx = W / 2, cy = H / 2;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (opts.speed || 14) * (0.4 + Math.random()) * devicePixelRatio;
      parts.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4 * devicePixelRatio,
        g: 0.28 * devicePixelRatio, drag: 0.985,
        life: 1, decay: 0.006 + Math.random() * 0.012,
        size: (opts.size || 6) * (0.5 + Math.random()) * devicePixelRatio,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        shape: opts.shape || (Math.random() < .5 ? 'rect' : 'circle')
      });
    }
  }
  function sparkleTrail() {
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * Math.PI * 2, r = (60 + Math.random() * 120) * devicePixelRatio;
      parts.push({
        x: W / 2 + Math.cos(a) * r, y: H / 2 + Math.sin(a) * r,
        vx: Math.cos(a) * 1.5, vy: -1.5 * devicePixelRatio, g: 0, drag: 1,
        life: 1, decay: 0.02, size: 3 * devicePixelRatio, color: '#fff', shape: 'star', rot: 0, vr: .1
      });
    }
  }
  let raf;
  function tick() {
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else if (p.shape === 'star') {
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
          const rr = k % 2 ? p.size * 2.2 : p.size * .6, an = k * Math.PI / 4;
          ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr);
        }
        ctx.closePath(); ctx.fill();
      } else { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    raf = requestAnimationFrame(tick);
  }
  tick();

  // ----- open sequence -----
  const card = $('#card'), hint = $('#hint');
  let opened = false;
  function openCard() {
    if (opened) return; opened = true;
    hint.style.opacity = 0;
    card.classList.add('shake');
    if (navigator.vibrate) navigator.vibrate([30, 40, 30, 40, 80]);
    let t = 0;
    const trail = setInterval(sparkleTrail, 40);
    setTimeout(() => {
      clearInterval(trail);
      card.classList.remove('shake');
      $('#flash').classList.add('on');
      $('#rays').classList.add('on');
      burst(220, { speed: 22, size: 8 });
      burst(120, { speed: 9, size: 4, shape: 'circle' });
      setTimeout(() => burst(90, { speed: 16, size: 5 }), 250);
      setTimeout(() => burst(60, { speed: 12, size: 10 }), 550);
      card.classList.add('open');
      if (navigator.vibrate) navigator.vibrate(120);
    }, 560);
  }
  card.addEventListener('click', openCard);

  // ----- toast -----
  const toast = $('#toast'); let tt;
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ----- copy helper -----
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = 0;
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  function baseUrl() { return location.origin + location.pathname; }

  // ----- build inner -----
  const inner = $('#inner');

  if (isReply) {
    // ===== sender view: show the answer =====
    $('#frontSub').textContent = '답장이 도착했어요';
    document.title = '답장이 도착했어요';
    const ok = answer === 'o';
    inner.innerHTML = `
      <div class="eyebrow">REPLY</div>
      <div class="question" style="font-size:16px;color:#6d6580;font-weight:600">${esc(question)}</div>
      <div class="result-mark ${ok ? 'o' : 'x'}">${ok ? 'O' : 'X'}</div>
      <div class="result-text">${ok ? '갈 수 있어! 🎉' : '오늘은 어려울 것 같아 😢'}</div>
      ${!ok && reason ? `<div class="result-reason"><b>REASON</b>${esc(reason)}</div>` : ''}
      <div class="spacer"></div>
      <button class="btn" id="newBtn">새 카드 보내기</button>
    `;
    inner.querySelector('#newBtn').addEventListener('click', async () => {
      const url = baseUrl() + (params.get('q') ? '?q=' + encodeURIComponent(question) : '');
      (await copyText(url)) ? showToast('새 카드 링크 복사됨 ✓') : showToast('복사 실패: ' + url);
    });
  } else {
    // ===== recipient view: choose O/X =====
    inner.innerHTML = `
      <div class="eyebrow">QUESTION</div>
      <div class="question">${esc(question)}<small>답을 고르고 링크를 복사해서 보내줘</small></div>
      <div class="choices">
        <button class="choice o" data-v="o">O</button>
        <button class="choice x" data-v="x">X</button>
      </div>
      <div class="reason" id="reasonBox">
        <textarea id="reasonInput" maxlength="200" placeholder="예) 야근이야 ㅠㅠ / 몸이 안 좋아 / 그냥 귀찮아 ㅋㅋ / 욕 적어도 됨"></textarea>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="copyBtn" disabled>답장 링크 복사</button>
      <div class="tip">복사한 링크를 카톡으로 그대로 보내면 돼요</div>
    `;
    let choice = null;
    const choices = inner.querySelectorAll('.choice');
    const reasonBox = inner.querySelector('#reasonBox');
    const reasonInput = inner.querySelector('#reasonInput');
    const copyBtn = inner.querySelector('#copyBtn');
    choices.forEach(b => b.addEventListener('click', () => {
      choice = b.dataset.v;
      choices.forEach(c => { c.classList.toggle('selected', c === b); c.classList.toggle('dim', c !== b); });
      reasonBox.classList.toggle('show', choice === 'x');
      copyBtn.disabled = false;
      copyBtn.classList.remove('done'); copyBtn.textContent = '답장 링크 복사';
      if (choice === 'o') burst(80, { speed: 10, size: 5 });
      if (navigator.vibrate) navigator.vibrate(20);
    }));
    copyBtn.addEventListener('click', async () => {
      if (!choice) return;
      const p = new URLSearchParams();
      if (params.get('q')) p.set('q', question);
      p.set('a', choice);
      if (choice === 'x' && reasonInput.value.trim()) p.set('r', reasonInput.value.trim());
      const url = baseUrl() + '?' + p.toString();
      if (await copyText(url)) {
        copyBtn.classList.add('done'); copyBtn.textContent = '복사 완료 ✓ 카톡에 붙여넣기';
        showToast('링크가 복사됐어요');
        burst(60, { speed: 8, size: 4 });
      } else {
        showToast('복사가 안 돼요. 링크를 길게 눌러 복사해주세요');
        copyBtn.textContent = url;
      }
    });

    // footer: change question (sender side, before sending)
    $('#footer').innerHTML = '<button id="editQ">질문 바꾸기</button> · <button id="copyQ">이 카드 링크 복사</button>';
    $('#editQ').addEventListener('click', () => {
      const q = prompt('질문을 입력하세요', question);
      if (q && q.trim()) location.search = '?q=' + encodeURIComponent(q.trim());
    });
    $('#copyQ').addEventListener('click', async () => {
      const url = baseUrl() + (params.get('q') ? '?q=' + encodeURIComponent(question) : '');
      (await copyText(url)) ? showToast('카드 링크 복사됨 ✓') : showToast('복사 실패');
    });
  }

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
})();
</script>
</body>
</html>
