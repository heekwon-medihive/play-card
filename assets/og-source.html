<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #1b1733 0%, #0b0a14 60%, #050409 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #fff; position: relative;
  }
  .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
  .rays {
    position: absolute; left: 340px; top: 315px; width: 1400px; height: 1400px;
    transform: translate(-50%,-50%) rotate(8deg);
    background: repeating-conic-gradient(from 0deg, rgba(246,211,101,0) 0deg, rgba(246,211,101,.14) 6deg, rgba(246,211,101,0) 12deg);
    border-radius: 50%;
    -webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 20%, transparent 45%);
  }
  .card {
    position: absolute; left: 190px; top: 90px; width: 300px; height: 450px; border-radius: 22px;
    background: linear-gradient(160deg, #2a2352 0%, #171331 55%, #0f0c22 100%);
    border: 1.5px solid rgba(246,211,101,.6);
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 60px rgba(138,108,255,.45), inset 0 0 40px rgba(246,211,101,.08);
    transform: rotate(-6deg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 10px; border-radius: 16px; border: 1px solid rgba(246,211,101,.4); }
  .card::after {
    content: ""; position: absolute; top: -60%; left: 20%; width: 60%; height: 220%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.18) 50%, transparent 100%);
    transform: rotate(12deg);
  }
  .seal {
    width: 92px; height: 92px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a3, #f6d365 45%, #b8862b 100%);
    box-shadow: 0 8px 40px rgba(246,211,101,.75), inset 0 -4px 10px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center; font-size: 46px;
  }
  .title { font-size: 16px; letter-spacing: .3em; color: #f6d365; font-weight: 600; }
  .sub { font-size: 13px; color: rgba(255,255,255,.5); letter-spacing: .1em; }
  .text { position: absolute; left: 600px; top: 0; height: 630px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .eyebrow { font-size: 20px; letter-spacing: .35em; color: #f6d365; font-weight: 700; }
  h1 { font-size: 66px; font-weight: 900; line-height: 1.2; letter-spacing: -.02em; }
  h1 span { background: linear-gradient(90deg, #f6d365, #ff6fb5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { font-size: 26px; color: rgba(255,255,255,.65); }
  .ox { display: flex; gap: 18px; margin-top: 8px; }
  .ox b {
    width: 74px; height: 74px; border-radius: 50%; border: 4px solid; display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 900; background: rgba(255,255,255,.04);
  }
  .o { color: #35e0a1; border-color: #35e0a1; box-shadow: 0 0 30px rgba(53,224,161,.4); }
  .x { color: #ff5c7a; border-color: #ff5c7a; box-shadow: 0 0 30px rgba(255,92,122,.4); }
  .conf { position: absolute; border-radius: 2px; }
</style></head>
<body>
<div class="rays"></div>
<div id="stars"></div>
<div id="conf"></div>
<div class="card">
  <div class="seal">💌</div>
  <div class="title">INVITATION</div>
  <div class="sub">탭해서 열어보기</div>
</div>
<div class="text">
  <div class="eyebrow">카드가 도착했어요</div>
  <h1>오늘<br><span>만날 수 있어?</span></h1>
  <p>카드를 열고 O · X로 답해줘</p>
  <div class="ox"><b class="o">O</b><b class="x">X</b></div>
</div>
<script>
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const st = document.getElementById('stars');
  for (let i = 0; i < 90; i++) { const s = document.createElement('div'); s.className = 'star';
    s.style.left = rnd()*1200+'px'; s.style.top = rnd()*630+'px'; s.style.opacity = .2 + rnd()*.7; s.style.transform = `scale(${.5+rnd()})`; st.appendChild(s); }
  const cols = ['#f6d365','#ff6fb5','#8a6cff','#5ef2ff','#fff','#ffb347'];
  const cf = document.getElementById('conf');
  for (let i = 0; i < 70; i++) { const c = document.createElement('div'); c.className = 'conf';
    const a = rnd()*Math.PI*2, r = 200 + rnd()*260;
    c.style.left = (340 + Math.cos(a)*r)+'px'; c.style.top = (315 + Math.sin(a)*r*0.8)+'px';
    c.style.width = (6+rnd()*12)+'px'; c.style.height = (4+rnd()*6)+'px';
    c.style.background = cols[Math.floor(rnd()*cols.length)]; c.style.transform = `rotate(${rnd()*360}deg)`; c.style.opacity = .5+rnd()*.5;
    cf.appendChild(c); }
</script>
</body></html>
